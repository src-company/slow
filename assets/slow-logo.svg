<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 249 249">
<!-- The master mark. Every shipped surface — the page favicon, the header
     wordmark, and the ERC-1155 render in SLOWNext._createImage — is this
     geometry, scaled. The plate's corners are continuous (superelliptical),
     not circular: an rx rounded rect of the same radius departs from this
     curve by 3.6px at 300px, which is visible, so the path is carried rather
     than approximated. -->
<path d="M0 19.671C0 12.9332 0 9.56425 1.26956 6.97276C2.48511 4.49151 4.49151 2.48511 6.97276 1.26956C9.56425 0 12.9332 0 19.671 0H229.329C236.067 0 239.436 0 242.027 1.26956C244.508 2.48511 246.515 4.49151 247.73 6.97276C249 9.56425 249 12.9332 249 19.671V229.329C249 236.067 249 239.436 247.73 242.027C246.515 244.508 244.508 246.515 242.027 247.73C239.436 249 236.067 249 229.329 249H19.671C12.9332 249 9.56425 249 6.97276 247.73C4.49151 246.515 2.48511 244.508 1.26956 242.027C0 239.436 0 236.067 0 229.329V19.671Z" fill="#0000FF"/>
<!-- The timelock, as a boundary you can see through. -->
<rect x="15.6" y="15.6" width="217.9" height="217.9" rx="17.2"
      fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="9.3" stroke-dasharray="11.7 9.3"/>
<!-- The S, cut as a squared spiral on the plate's own grid. -->
<path d="M186.75,62.25 H62.25 V136.17 H163.41 V163.41 H62.25 V186.75 H186.75 V112.83 H85.59 V85.59 H186.75 Z" fill="#FFFFFF"/>
</svg>
