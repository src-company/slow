/* ══════════════════════════════════════════════════════════════════
   Recipient resolution
   ══════════════════════════════════════════════════════════════════ */
function setNote(node,text,cls){ node.textContent=text; node.className='note'+(cls?' '+cls:''); }
async function resolveRecipient(input){
  const seq=++S.resolveSeq;
  const stale=()=>S.resolveSeq!==seq;
  setNote(el.ens,'Resolving…','mute');
  el.confirmBtn.disabled=true;
  try {
    if(isAddr(input)){
      const key=input.toLowerCase();
      const name = key in S.ens ? S.ens[key] : await reverseAny(input);
      if(stale()) return false;
      S.ens[key]=name||null;
      S.resolved=input; S.resolvedName=name||null;
      setNote(el.ens, name?`${name} · ${shortAddr(input)}`:'Valid address','ok');
      updateSummary();
      return true;
    }
    if(input.includes('.')){
      const key=input.toLowerCase();
      const a = key in S.ens ? S.ens[key] : await resolveName(input);
      if(stale()) return false;
      S.ens[key]=a||null;
      if(a&&isAddr(a)){
        S.resolved=a; S.resolvedName=input;
        setNote(el.ens,`${input} · ${shortAddr(a)}`,'ok');
        updateSummary();
        return true;
      }
      setNote(el.ens,`No address is set for ${input}`,'err');
      return false;
    }
    setNote(el.ens,'Enter an address, a .eth name, or a .wei name','err');
    return false;
  } catch(e){
    if(!stale()) setNote(el.ens,'Could not reach a name resolver — try again','err');
    return false;
  } finally {
    if(!stale()) el.confirmBtn.disabled=false;
  }
}
function updateSummary(){
  if(!S.amount||!S.symbol||!S.delayDisplay) return;
  let s=`${S.amount} ${S.symbol} · ${S.delayDisplay}`;
  if(S.resolved) s+=` → ${S.resolvedName||shortAddr(S.resolved)}`;
  el.summary.textContent=s;
}
async function updateTipPreview(){
  if(!S.autoClaim){ el.tipPre.textContent=''; return; }
  el.tipPre.textContent='Estimating the keeper tip…';
  const tip=await estimateTip(S.token);
  if(!S.autoClaim) return;
  S.tip=tip;
  el.tipPre.textContent=`Keeper tip ≈ ${fmtAmt(tip,18)} ETH — refunded if the recipient settles it themselves.`;
}
async function previewPlan(){
  el.planNote.textContent='';
  if(!S.account||!S.token||!S.amount) return;
  const c=cfg();
  const prefix = S.chainId!=null && S.chainId!==c.id
    ? `On ${c.name} — your wallet will be asked to switch. ` : `On ${c.name}. `;
  try {
    const meta = S.token===ZERO?{decimals:18}:await tokenMeta(S.token);
    const wei = parseUnits(S.amount,meta.decimals);
    const plan = await planDeposit(wei);
    el.planNote.textContent = prefix + planLabel(plan);
  } catch(e){ el.planNote.textContent = prefix.trim(); }
}

/* ══════════════════════════════════════════════════════════════════
   Confirm
   ══════════════════════════════════════════════════════════════════ */
function openConfirmation(){
  updateSummary();
  S.autoClaim=false; S.tip=0n;
  el.autoClaimChk.checked=false; el.tipPre.textContent=''; el.planNote.textContent='';
  showModal(el.confirmModal);
  // Do not steal focus into the field on touch — the keyboard would cover the
  // summary the reader is meant to check.
  if(matchMedia('(hover:hover)').matches) el.recipientInput.focus();
  render();
  previewPlan();
}
async function handleConfirm(){
  if(!S.account && !await connect(true)) return;
  if(!await ensureChain()) return;
  if(!S.resolved){
    const v=el.recipientInput.value.trim();
    if(!v){ setNote(el.ens,'Who is this going to?','err'); el.recipientInput.focus(); return; }
    if(!await resolveRecipient(v)){ el.recipientInput.focus(); return; }
  }
  try {
    if(S.slowDeployed[S.chain]===false) throw new Error(`SLOW is not deployed on ${cfg().name}`);
    const meta = S.token===ZERO?{decimals:18}:await tokenMeta(S.token);
    if(S.token!==ZERO && !meta.ok) throw new Error('That token did not answer symbol() or decimals()');
    const wei=parseUnits(S.amount,meta.decimals);
    if(S.balance!==null && wei>S.balance)
      throw new Error(`You have ${fmtAmt(S.balance,meta.decimals)} ${S.symbol}`);
    hideModal(el.confirmModal);
    await deposit();
    toast('Sent. The funds are locked in SLOW.',5500);
    setView('home');
    loadTransfers(true);
  } catch(e){
    fail(e);
    if(!isRejection(e)) showModal(el.confirmModal);
  } finally { hideLoad(); }
}

/* ══════════════════════════════════════════════════════════════════
   Wiring
   ══════════════════════════════════════════════════════════════════ */
function applyTheme(light){
  document.body.classList.toggle('light',light);
  el.themeBtn.textContent=light?'☀':'☾';
  el.themeBtn.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');
}
(()=>{
  let pref=null;
  try { pref=localStorage.getItem('slow.theme'); } catch(e){}
  applyTheme(pref ? pref==='light' : matchMedia('(prefers-color-scheme: light)').matches);
})();
el.themeBtn.onclick=()=>{
  const light=!document.body.classList.contains('light');
  applyTheme(light);
  try { localStorage.setItem('slow.theme',light?'light':'dark'); } catch(e){}
};

el.chainBtn.onclick=()=>{
  el.chainList.replaceChildren();
  for(const id of CHAIN_IDS){
    const c=CHAINS[id];
    const b=document.createElement('button');
    b.type='button'; b.className='wallet-opt';
    b.setAttribute('aria-current',String(id===S.chain));
    const t=document.createElement('span');
    t.textContent=c.name;
    const sm=document.createElement('small');
    sm.textContent=`chain ${c.id}${id===S.chain?' · active':''}`;
    t.appendChild(sm); b.appendChild(t);
    b.onclick=()=>{ hideModal(el.chainModal); switchChain(id); };
    el.chainList.appendChild(b);
  }
  showModal(el.chainModal);
};
el.chainCancel.onclick=()=>hideModal(el.chainModal);
el.walletBtn.onclick=()=>S.account?disconnect():connect(true);
el.sendBox.onclick=()=>setView('send');
el.takeBox.onclick=async()=>{
  if(S.view==='take'){ setView('home'); return; }
  setView('take');
  if(!S.account) await connect(true);
};
el.backBtn.onclick=()=>setView('send');

el.cryptoGrid.addEventListener('click',e=>{
  const b=e.target.closest('.crypto'); if(!b) return;
  S.token=b.dataset.token.toLowerCase();
  S.symbol=b.dataset.symbol;
  S.decimals = Number(b.dataset.decimals) || 18;
  S.amount=null; S.step=Math.max(S.step,1);
  tokenMeta(S.token).then(m=>{ if(S.token===b.dataset.token.toLowerCase()){ S.decimals=m.decimals; paintPresets(); } });
  paintPresets(); refreshBalance();
});
el.amountRow.addEventListener('click',e=>{
  const o=e.target.closest('.opt'); if(!o||o.disabled) return;
  if(o===el.customAmountOpt){
    el.amountInput.value=S.amount||'';
    el.amountNote.textContent = S.balance!==null ? `You have ${fmtAmt(S.balance,S.decimals)} ${S.symbol}` : '';
    showModal(el.amountModal);
    return;
  }
  S.amount=o.dataset.amount; S.step=Math.max(S.step,2); render();
});
el.timeRow.addEventListener('click',e=>{
  const o=e.target.closest('.opt'); if(!o) return;
  if(o===el.customTimeOpt){ showModal(el.timeModal); return; }
  S.delay=parseInt(o.dataset.time); S.delayDisplay=o.textContent;
  openConfirmation();
});
el.amountApply.onclick=()=>{
  const raw=el.amountInput.value.trim();
  try {
    const wei=parseUnits(raw,S.decimals);
    if(wei<=0n){ el.amountNote.textContent='Enter an amount greater than zero'; return; }
    if(S.balance!==null&&wei>S.balance){ el.amountNote.textContent=`That is more than your ${fmtAmt(S.balance,S.decimals)} ${S.symbol}`; return; }
    S.amount=raw; S.step=Math.max(S.step,2);
    hideModal(el.amountModal); render();
  } catch(e){ el.amountNote.textContent=e.message; }
};
el.customTokenOpt.onclick=()=>{
  el.tokenInput.value=''; setNote(el.tokenStatus,'');
  showModal(el.tokenModal);
};
el.tokenApply.onclick=async()=>{
  const addr=el.tokenInput.value.trim();
  if(!isAddr(addr)){ setNote(el.tokenStatus,'That is not a contract address','err'); return; }
  setNote(el.tokenStatus,'Reading the token…','mute');
  const meta=await tokenMeta(addr);
  if(!meta.ok){ setNote(el.tokenStatus,'That address did not answer symbol() or decimals()','err'); return; }
  S.token=addr.toLowerCase(); S.symbol=meta.symbol; S.decimals=meta.decimals;
  S.amount=null; S.step=Math.max(S.step,1);
  hideModal(el.tokenModal);
  paintPresets(); refreshBalance();
};
el.timeApply.onclick=()=>{
  const r=fmtCustomTime({d:el.dInput.value,h:el.hInput.value,m:el.mInput.value,s:el.sInput.value});
  if(!r.seconds){ toast('Enter a delay longer than zero'); return; }
  if(r.seconds>MAX_DELAY){ toast('The longest delay is 100 years'); return; }
  S.delay=r.seconds; S.delayDisplay=r.display;
  hideModal(el.timeModal);
  openConfirmation();
};
el.tokenInput.addEventListener('keydown',e=>{ if(e.key==='Enter') el.tokenApply.click(); });
el.amountInput.addEventListener('keydown',e=>{ if(e.key==='Enter') el.amountApply.click(); });
[el.dInput,el.hInput,el.mInput,el.sInput].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') el.timeApply.click(); }));

el.autoClaimChk.onchange=()=>{ S.autoClaim=el.autoClaimChk.checked; updateTipPreview(); previewPlan(); };
let ensTimer;
el.recipientInput.addEventListener('input',()=>{
  const v=el.recipientInput.value.trim();
  S.resolved=null; S.resolvedName=null; S.resolveSeq++;
  updateSummary();
  clearTimeout(ensTimer);
  if(!v){ setNote(el.ens,''); return; }
  ensTimer=setTimeout(()=>resolveRecipient(v),450);
});
el.recipientInput.addEventListener('keydown',e=>{ if(e.key==='Enter') el.confirmBtn.click(); });
el.confirmBtn.onclick=handleConfirm;
el.confirmCancel.onclick=()=>hideModal(el.confirmModal);
el.detailClose.onclick=()=>hideModal(el.detailModal);

qsa('.tab[data-tab]').forEach(t=>t.addEventListener('click',()=>{
  S.tab=t.dataset.tab; render(); renderList();
}));
el.list.addEventListener('scroll',hideTip,{passive:true});
addEventListener('resize',hideTip);
addEventListener('focus',()=>{ if(S.view==='take'&&S.account) loadTransfers(false); });

/*
   Which chain is this page for? A gateway serves it from
   <0xADDRESS>.<chainId>.<gateway> on ERC-4804 hosts, and from a bare
   <0xADDRESS>.<gateway> on ERC-8244 ones. If the hostname names a chain the
   page knows, that is the one it was published on and the one to open on.
   Otherwise fall back to the reader's last choice.
*/
(()=>{
  const parts=(location.hostname||'').split('.');
  const fromHost = /^0x[0-9a-fA-F]{40}$/.test(parts[0]||'') && /^\d+$/.test(parts[1]||'')
    ? Number(parts[1]) : null;
  let saved=null;
  try { saved=Number(localStorage.getItem('slow.chain'))||null; } catch(e){}
  const pick = (fromHost && CHAINS[fromHost]) ? fromHost
    : (saved && CHAINS[saved]) ? saved : MAINNET;
  S.chain=pick;
})();
buildTokenGrid(); paintChain(); paintNet(); render(); paintPresets();
checkDeployed();
eagerConnect();
})();
</script>
</body>
</html>
